# Example configuration file.
# Copy relevant values into application.properties for local development.
#
# The JWT secret below is a placeholder. For any real deployment:
#   - generate a long random secret (>= 256 bits)
#   - provide it via an environment variable, NOT source control
#
# Example (PowerShell):  $env:APP_JWT_SECRET = "..."
# Then reference it:     app.jwt.secret=${APP_JWT_SECRET}

server.port=5000
spring.datasource.url=jdbc:sqlite:data/healthcare_experience.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update

app.jwt.secret=change-this-secret-for-local-development-only-please-make-it-long
app.jwt.expiration-ms=86400000
app.cors.allowed-origin=http://localhost:5173,http://127.0.0.1:5173

# Feedback email. Use valid SMTP credentials or an approved transactional provider.
# Never commit real values; set these as environment variables.
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
app.feedback.from=${APP_FEEDBACK_FROM:${MAIL_USERNAME:no-reply@healthpath.local}}
app.feedback.recipient=${APP_FEEDBACK_RECIPIENT:aulon.miftari@student.uni-pr.edu}
