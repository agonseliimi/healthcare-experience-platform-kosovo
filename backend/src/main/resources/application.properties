spring.application.name=healthcare-experience-platform-kosovo

# Load local development secrets from backend/.env when the backend is started
# from the backend directory. The file is gitignored and optional.
spring.config.import=optional:file:.env[.properties]

# Backend runs on port 5000 (frontend expects http://localhost:5000/api)
server.port=5000

# ---- SQLite datasource ----
# The database file is created automatically at backend/data/healthcare_experience.db
spring.datasource.url=jdbc:sqlite:data/healthcare_experience.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# ---- JPA / Hibernate ----
# SQLite dialect comes from the hibernate-community-dialects dependency.
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=false

# SQLite is a single-file DB and does not handle concurrent writers well.
# One connection keeps the demo simple and avoids "database is locked" errors.
spring.datasource.hikari.maximum-pool-size=1

# ---- File upload (verification documents) ----
# Uploaded documents are stored privately on disk (never served publicly).
# Only administrators can download them through a protected endpoint.
app.upload.dir=data/uploads
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB

# ---- Feedback email (all credentials come from the environment) ----
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS_REQUIRED:false}
app.feedback.from=${APP_FEEDBACK_FROM:${MAIL_USERNAME:no-reply@healthpath.local}}
app.feedback.recipient=${APP_FEEDBACK_RECIPIENT:aulon.miftari@student.uni-pr.edu}

# ---- JWT ----
# NOTE: This secret is for LOCAL DEVELOPMENT ONLY. Never commit a real secret.
# In production, load this from an environment variable or a secrets manager.
app.jwt.secret=change-this-secret-for-local-development-only-please-make-it-long
app.jwt.expiration-ms=86400000

# ---- CORS ----
# The frontend dev server origin allowed to call this API.
app.cors.allowed-origin=http://localhost:5173

# ---- springdoc / swagger ----
springdoc.swagger-ui.path=/swagger-ui.html
